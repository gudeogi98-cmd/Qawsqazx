name: AI agent team

on:
  workflow_dispatch:
    inputs:
      task:
        description: "팀에게 맡길 작업 (예: '30대 직장인을 위한 재테크 입문 가이드 써줘')"
        required: true

permissions:
  contents: write

concurrency:
  group: agent-team
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY가 없습니다. Settings → Secrets and variables → Actions에서 추가해 주세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run agent team
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK: ${{ inputs.task }}
        run: |
          python -m agent_team "$TASK" > final.md
          {
            echo "## 최종 결과물"
            echo
            cat final.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit result
        if: always()
        run: |
          git config user.name "agent-team-bot"
          git config user.email "agent-team-bot@users.noreply.github.com"
          git add -A team_outputs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
          else
            git commit -m "에이전트 팀 작업 결과 $(date -u +%Y-%m-%d)"
            git push
          fi
